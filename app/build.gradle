apply plugin: 'com.android.application'

android {
    namespace 'ru.proghouse.robocam'
    compileSdk 36

    defaultConfig {
        applicationId "ru.proghouse.robocam"
        minSdk 19
        targetSdk 36
        versionCode 45
        versionName '1.5.2'
        // minSdk < 21 has no native multidex; the ads SDK + AndroidX exceed the 64K method limit
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        aidl true
    }
}

dependencies {
    implementation 'org.webbitserver:webbit:0.4.15'
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    testImplementation 'junit:junit:4.12'
}
